model = "gpt-5.6-sol"
model_reasoning_effort = "high"
personality = "pragmatic"

[analytics]
enabled = false

[feedback]
enabled = false

[otel]
log_user_prompt = false
exporter = "none"
trace_exporter = "none"
metrics_exporter = "none"

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."build-web-apps@openai-curated"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."figma@openai-curated"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[[skills.config]]
name = "build-web-apps:supabase-postgres-best-practices"
enabled = false

[[skills.config]]
name = "build-web-apps:stripe-best-practices"
enabled = false

[desktop]
ambient-suggestions-enabled = true
preventSleepWhileRunning = true
keepRemoteControlAwakeWhilePluggedIn = true
conversationDetailMode = "STEPS_COMMANDS"
followUpQueueMode = "queue"
open-link-in-target-preference = "external-browser"

[features]
hooks = true
js_repl = false

# __MCP_SERVERS__
